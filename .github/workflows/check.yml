name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy check
        run: python3 scripts/privacy_check.py --all
      - name: Leaderboard data check
        run: python3 leaderboard/build.py --check
      - name: Unit tests
        run: python3 -m unittest discover -s tests
